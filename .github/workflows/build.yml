name: Build KillFeed

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Compilar
        run: |
          POM=$(find . -name pom.xml -not -path "*/target/*" | head -1)
          if [ -z "$POM" ]; then echo "No hay pom.xml en el repo"; ls -R | head -50; exit 1; fi
          echo "Usando $POM"
          mvn -B -e -f "$POM" clean package

      - name: Subir el .jar
        uses: actions/upload-artifact@v4
        with:
          name: KillFeed
          path: '**/target/KillFeed.jar'

      - name: Publicar release (solo con tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: '**/target/KillFeed.jar'
